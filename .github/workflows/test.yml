name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v3.7.0
      - name: Set up Go
        uses: actions/setup-go@v3.6.1
        with:
          go-version: "1.19"
          cache: true

      - name: Test
        run: make test
        shell: bash

      - name: Send coverage
        if: always()
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: profile.cov
          parallel: true
